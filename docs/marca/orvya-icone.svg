<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ícone do Orvya: símbolo da marca (círculo com ponto em órbita) sobre o gradiente violeta.
       Quadrado sem cantos arredondados: Meta, lojas e navegadores aplicam a própria máscara. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D4AFF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#fundo)"/>
  <rect width="1024" height="1024" fill="url(#brilho)"/>
  <!-- Símbolo da interface ampliado: no tamanho grande o ponto ganha um respiro do círculo,
       para ler como "em órbita". Conjunto centralizado no quadrado. -->
  <circle cx="490" cy="534" r="232" fill="none" stroke="#FFFFFF" stroke-width="74"/>
  <circle cx="757" cy="309" r="52" fill="#FFFFFF"/>
</svg>
