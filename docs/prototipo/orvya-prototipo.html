function vCanais(){
  const nums=numsOf();const tps=tplsOf();const ints=S.integrations[S.co]||{};
  const numCards=nums.map((x,i)=>{const on=x.status==="connected";const pct=Math.min(100,x.used/FREE_SERVICE*100);
    return `<article class="num-card ${on?"on":""}"><div class="h"><div class="grow"><span class="muted" style="font-size:12px">Número ${i+1} · API oficial do WhatsApp</span><h3>${esc(x.label)}</h3></div>
      <span class="pill ${on?"ok":""}">${on?"Conectado":"Não conectado"}</span></div>
      <div class="phone ${on?"":"off"}">${on?esc(x.phone):"Nenhum número conectado ainda"}</div>
      ${on?`<div class="meter"><div class="l"><span>Conversas iniciadas pelo cliente no mês</span><span>${x.used} de ${FREE_SERVICE.toLocaleString("pt-BR")} sem custo</span></div><div class="track"><i style="width:${pct}%"></i></div></div>
      <div class="stats"><div><span>Qualidade</span><b>${x.quality}</b></div><div><span>Leads abertos</span><b>${S.leads.filter(l=>l.line===x.id&&kindOf(l)==="open").length}</b></div><div><span>Conectado</span><b>${rel(x.since)}</b></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-action="num-rename" data-id="${x.id}">Renomear</button><button class="btn sm ghost danger" data-action="num-off" data-id="${x.id}">Desconectar</button></div>`
      :`<p class="muted" style="margin:0;font-size:13px">Use um número exclusivo para este canal. Ele pode seguir no app WhatsApp Business se a conexão for feita com coexistência.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-action="num-connect" data-id="${x.id}">Conectar com a Meta</button><button class="btn sm" data-action="num-rename" data-id="${x.id}">Renomear</button></div>`}
    </article>`}).join("");
  const tplRows=tps.map(t=>`<tr><td><b style="font-weight:600">${esc(t.name)}</b><div class="muted" style="font-size:12px;max-width:420px">${esc(t.text)}</div></td><td>${t.cat}</td><td class="num">${cost(TPL_COST[t.cat])}</td>
    <td><span class="pill ${t.status==="Aprovado"?"ok":t.status==="Rejeitado"?"bad":"warn"}">${t.status}</span></td>
    <td>${t.status!=="Aprovado"?`<button class="btn sm" data-action="tpl-approve" data-id="${t.id}">Simular aprovação</button>`:""}</td></tr>`).join("");
  const intRows=INTEGRATIONS.map(it=>{const on=!!ints[it.k];return `<div class="int"><span class="ic">${it.ic}</span><div class="grow"><b>${it.name}</b><p>${it.desc}</p></div>
    <span class="pill ${on?"ok":""}">${on?"Configurado":"Não configurado"}</span><button class="btn sm" data-action="int-open" data-id="${it.k}">${on?"Ver":"Configurar"}</button></div>`}).join("");
  return `<div class="grid" style="gap:20px">
    <section><div class="toolbar" style="justify-content:space-between;margin-bottom:10px"><div><h2 style="font-size:16px">WhatsApp da ${esc(CO().short)}</h2><p class="muted" style="margin:2px 0 0;font-size:12.5px">Até 2 números por empresa, os dois pela API oficial. Dá para começar testando com 1 e conectar o segundo depois.</p></div></div>
      <div class="grid g-2">${numCards}</div></section>
    <section class="panel"><div class="toolbar" style="justify-content:space-between"><div><h2>Modelos de mensagem</h2><p class="sub" style="margin:2px 0 0">Obrigatórios para falar com o cliente depois de 24 horas sem resposta dele. Cada modelo passa pela aprovação da Meta. Custos estimados por envio.</p></div>
      <button class="btn sm primary" data-action="tpl-new">Novo modelo</button></div>
      <div class="scroll-x"><table><thead><tr><th>Modelo</th><th>Categoria</th><th class="num">Custo estimado</th><th>Status</th><th></th></tr></thead><tbody>${tplRows}</tbody></table></div></section>
    <section class="panel"><h2>Anúncios, site e outros canais</h2><p class="sub">Essas ligações fazem o painel de origem mostrar o retorno de cada campanha em vendas fechadas.</p><div class="row-list">${intRows}</div></section>
  </div>`;
}

/* ---------- Drawer do lead ---------- */
function renderDrawer(){
  const d=document.getElementById("drawer"),sc=document.getElementById("scrim");
  const l=UI.lead&&byId(UI.lead);
  if(!l){d.classList.remove("on");sc.classList.remove("on");return}
  const c=COMPANIES[l.co],p=pipeOf(l),k=kindOf(l),open=k==="open";
  const prevScroll=(d.querySelector(".dr-body")||{}).scrollTop||0;const same=d.dataset.lead===l.id;
  const sel=(key,opts,val)=>`<select data-f="${key}">${opts.map(o=>Array.isArray(o)?`<option value="${o[0]}" ${o[0]===val?"selected":""}>${o[1]}</option>`:`<option ${o===val?"selected":""}>${o}</option>`).join("")}</select>`;
  const tasks=S.tasks.filter(t=>t.lead===l.id).sort((a,b)=>a.done-b.done||new Date(a.due)-new Date(b.due));
  const avail=S.products[l.co].filter(x=>!l.interest.includes(x.id));
  const wonName=p.stages.find(s=>s.kind==="won").name;
  const nb=l.line&&numById(l.line);
  d.dataset.lead=l.id;
  d.innerHTML=`<div class="dr-head"><span class="av">${initials(l.name)}</span><div class="grow"><h2>${esc(l.name)}</h2><p>${esc(l.phone)}${l.org?" · "+esc(l.org):""}</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><span class="pill">${c.short}</span><span class="pill ${k==="won"?"ok":k==="lost"?"bad":"ind"}">${p.name}: ${stageOf(l).name}</span><span class="ch ${l.channel}">${l.channel==="whatsapp"&&nb?"WhatsApp "+esc(nb.label):chLabel(l.channel)}</span>${l.lostReason&&k==="lost"?`<span class="pill bad">${esc(l.lostReason)}</span>`:""}</div></div>
    <button class="btn sm ghost" data-action="close-drawer">Fechar</button></div>
    <div class="dr-body">
      ${l.msgs.length||l.summary?`<div class="ai-box"><div class="l"><b style="font-size:13px">Agente IA</b>${open?(l.ai?'<span class="pill ind">Respondendo</span>':'<span class="pill">Pausado</span>'):'<span class="pill">Negócio encerrado</span>'}<span class="muted" style="font-size:12px">score ${l.score}</span>
        ${open&&l.msgs.length?`<button class="btn sm" style="margin-left:auto" data-action="${l.ai?"assume":"return-ai"}" data-id="${l.id}">${l.ai?"Assumir conversa":"Devolver para IA"}</button>`:""}</div>${l.summary?`<p>${esc(l.summary)}</p>`:""}</div>`:""}
      <div class="dr-sec"><h3>Negócio</h3><div class="fgrid">
        <label class="field"><span>Funil</span>${sel("pipe",Object.entries(c.pipelines).map(([id,x])=>[id,x.name]),l.pipe)}</label>
        <label class="field"><span>Etapa</span>${sel("stage",p.stages.map(s=>[s.id,s.name]),l.stage)}</label>
        <label class="field"><span>Valor (R$)</span><input type="number" step="0.01" min="0" data-f="value" value="${l.value}"></label>
        <label class="field"><span>Temperatura</span>${sel("temp",[["quente","Quente"],["morno","Morno"],["frio","Frio"]],l.temp)}</label>
        <label class="field"><span>Responsável</span>${sel("owner",c.team,l.owner)}</label>
        <label class="field"><span>Origem</span>${sel("source",c.sources,l.source)}</label>
        <label class="field"><span>Tipo de cliente</span>${sel("type",[["B2C","Paciente ou família"],["B2B","Empresa ou instituição"]],l.type)}</label>
        <label class="field"><span>Canal</span>${sel("channel",[["whatsapp","WhatsApp"],["instagram","Instagram"],["messenger","Messenger"]],l.channel)}</label>
        ${l.channel==="whatsapp"?`<label class="field full"><span>Número da empresa que atende</span>${sel("line",numsOf(l.co).map(x=>[x.id,x.label+(x.status==="connected"?"":" (não conectado)")]),l.line)}</label>`:""}
        <label class="field"><span>Nome</span><input data-f="name" value="${esc(l.name)}"></label>
        <label class="field"><span>Telefone do cliente</span><input data-f="phone" value="${esc(l.phone)}"></label>
        <label class="field full"><span>Empresa ou instituição</span><input data-f="org" value="${esc(l.org)}" placeholder="Opcional"></label>
      </div></div>
      ${p.fields.length?`<div class="dr-sec"><h3>Campos de ${p.name}</h3><div class="fgrid">${p.fields.map(f=>`<label class="field ${f.full?"full":""}"><span>${f.label}</span>${f.type==="select"?`<select data-cf="${f.k}">${f.options.map(o=>`<option ${o===(l.fields[f.k]||f.options[0])?"selected":""}>${o}</option>`).join("")}</select>`:`<input type="${f.type}" data-cf="${f.k}" value="${esc(l.fields[f.k]??"")}">`}</label>`).join("")}</div></div>`:""}
      <div class="dr-sec"><h3>${l.co==="loc"?"Equipamentos de interesse":"Produtos de interesse"}</h3>
        <div class="chips" style="margin-bottom:8px">${l.interest.map(pid=>{const x=prod(l.co,pid);if(!x)return "";const rent=x.rent&&l.pipe==="locacao";return `<span class="pill ind" style="padding:4px 8px 4px 10px">${esc(x.name)}, ${money(rent?x.rent:x.price)}${rent?" por mês":""}<button class="link" style="margin-left:6px;color:inherit" data-action="rm-int" data-id="${pid}" aria-label="Remover ${esc(x.name)}">✕</button></span>`}).join("")||'<span class="muted" style="font-size:13px">Nenhum ainda.</span>'}</div>
        ${avail.length?`<select class="inp" id="addInt" aria-label="Adicionar do catálogo"><option value="">Adicionar do catálogo…</option>${avail.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>`:""}</div>
      <div class="dr-sec"><h3>Tarefas</h3>${tasks.length?`<div class="row-list">${tasks.map(taskRow).join("")}</div>`:'<p class="muted" style="font-size:13px;margin:0 0 8px">Nenhuma tarefa.</p>'}
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input class="inp" id="dtText" placeholder="Nova tarefa para este lead" style="flex:2;min-width:160px"><input class="inp" id="dtDate" type="date" value="${isoDate(1)}" style="flex:1;min-width:130px" aria-label="Prazo"><button class="btn sm primary" style="height:38px" data-action="add-dtask">Adicionar</button></div></div>
      <div class="dr-sec"><h3>Histórico</h3>
        <div style="display:flex;gap:8px;margin-bottom:12px"><textarea class="inp" id="noteText" rows="2" placeholder="Registrar anotação, ligação ou visita" style="flex:1"></textarea><button class="btn sm" style="height:38px" data-action="add-note">Salvar</button></div>
        <div class="tl">${l.history.map(h=>`<div class="tl-item ${h.kind}"><i></i><div><p>${esc(h.text)}</p><small>${esc(h.by)} · ${rel(h.at)}</small></div></div>`).join("")}
          <div class="tl-item"><i style="background:var(--line-2)"></i><div><p>Lead criado pela origem ${esc(l.source)}</p><small>${rel(l.created)}</small></div></div></div></div>
    </div>
    <div class="dr-foot">${l.msgs.length?`<button class="btn primary" data-action="goto-conv" data-id="${l.id}">Abrir conversa</button>`:""}
      ${open?`<button class="btn" data-action="mark-won" data-id="${l.id}">Marcar ${esc(lc1(wonName))}</button><button class="btn danger" data-action="mark-lost" data-id="${l.id}">Perdido</button>`:""}
      <span style="flex:1"></span><button class="btn ghost danger" data-action="del-lead" data-id="${l.id}">Excluir lead</button></div>`;
  if(same)d.querySelector(".dr-body").scrollTop=prevScroll;
  d.classList.add("on");sc.classList.add("on");
}

/* ============ Modal e aviso ============ */
function modal(html){const w=document.getElementById("modalWrap");document.getElementById("modal").innerHTML=html;w.classList.add("on");const f=w.querySelector("input,select");if(f)f.focus()}
function closeModal(){document.getElementById("modalWrap").classList.remove("on")}
function toast(t,kind=""){const el=document.createElement("div");el.className="toast "+kind;el.textContent=t;document.getElementById("toasts").appendChild(el);setTimeout(()=>el.remove(),4500)}
function newLeadModal(){
  const c=CO(),pid=S.pipe[S.co];const nums=numsOf();
  modal(`<h2>Novo lead na ${c.short}</h2>
    <div class="fgrid"><label class="field full"><span>Nome</span><input id="nlName" placeholder="Paciente, familiar ou empresa"></label>
    <label class="field"><span>Telefone do cliente</span><input id="nlPhone" inputmode="tel" placeholder="(86) 99999-0000"></label>
    <label class="field"><span>Canal</span><select id="nlCh"><option value="whatsapp">WhatsApp</option><option value="instagram">Instagram</option><option value="messenger">Messenger</option></select></label>
    <label class="field full"><span>Número da empresa que atende</span><select id="nlLine">${nums.map(x=>`<option value="${x.id}">${esc(x.label)}${x.status==="connected"?"":" (não conectado)"}</option>`).join("")}</select></label>
    <label class="field"><span>Funil</span><select id="nlPipe">${Object.entries(c.pipelines).map(([id,p])=>`<option value="${id}" ${id===pid?"selected":""}>${p.name}</option>`).join("")}</select></label>
    <label class="field"><span>Origem</span><select id="nlSrc">${c.sources.map(s=>`<option>${s}</option>`).join("")}</select></label>
    <label class="field"><span>Responsável</span><select id="nlOwner">${c.team.map(s=>`<option>${s}</option>`).join("")}</select></label>
    <label class="field"><span>Tipo de cliente</span><select id="nlType"><option value="B2C">Paciente ou família</option><option value="B2B">Empresa ou instituição</option></select></label></div>
    <p id="nlErr" style="color:var(--bad-fg);font-size:13px;margin:0" hidden></p>
    <div class="acts"><button class="btn" data-action="modal-close">Cancelar</button><button class="btn primary" data-action="create-lead">Criar lead</button></div>`);
}

/* ============ Eventos ============ */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-action]");if(!b)return;
  const a=b.dataset.action,id=b.dataset.id;
  const L=id?byId(id):null;
  switch(a){
    case "co":S.co=id;UI.lead=null;UI.conv=null;UI.owner="";UI.temp="";UI.taskFilter="";UI.sel={};UI.react=null;UI.rulePipe=null;UI.threadOpen=false;UI.line="";save();render();break;
    case "nav":closeModal();UI.view=id;UI.threadOpen=false;render();document.getElementById("main").scrollTop=0;break;
    case "pipe":S.pipe[S.co]=id;save();renderMain();break;
    case "theme":toggleTheme();break;
    case "open-lead":if(dragged)return;closeModal();UI.lead=id;renderDrawer();break;
    case "close-drawer":UI.lead=null;renderDrawer();break;
    case "new-lead":newLeadModal();break;
    case "modal-close":closeModal();break;
    case "create-lead":{
      const name=document.getElementById("nlName").value.trim(),phone=document.getElementById("nlPhone").value.trim();
      const err=document.getElementById("nlErr");const digits=phone.replace(/\D/g,"");
      if(!name||digits.length<10){err.hidden=false;err.textContent="Informe o nome e um telefone com DDD.";return}
      const dup=S.leads.find(x=>x.co===S.co&&x.phone.replace(/\D/g,"")===digits);
      if(dup){err.hidden=false;err.innerHTML=`Este telefone já está no lead ${esc(dup.name)}. <button class="link" data-action="open-lead" data-id="${dup.id}">Abrir lead</button>`;return}
      const pipe=document.getElementById("nlPipe").value;const ch=document.getElementById("nlCh").value;const now=nowIso();
      const nl={id:uid("L"),co:S.co,pipe,stage:COMPANIES[S.co].pipelines[pipe].stages[0].id,name,phone,org:"",type:document.getElementById("nlType").value,temp:"morno",
        owner:document.getElementById("nlOwner").value,source:document.getElementById("nlSrc").value,channel:ch,line:ch==="whatsapp"?document.getElementById("nlLine").value:null,value:0,interest:[],score:50,
        ai:false,needsHuman:false,needReason:"",lastContact:now,created:now,updated:now,closedAt:null,lostReason:"",summary:"",fields:{},msgs:[],history:[]};
      S.leads.push(nl);save();closeModal();UI.lead=nl.id;render();toast(`${first(name)} entrou no funil ${COMPANIES[S.co].pipelines[pipe].name}.`);break}
    case "lost-pick":document.querySelectorAll("#lostChips .chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));document.getElementById("lostOther").value="";break;
    case "lost-confirm":{
      const picked=document.querySelector('#lostChips .chip[aria-pressed="true"]');const other=document.getElementById("lostOther").value.trim();
      const reason=other||(picked&&picked.dataset.id);if(!reason){toast("Escolha ou descreva o motivo da perda.");return}
      closeModal();moveLead(id,b.dataset.stage,{reason});break}
    case "conv":UI.conv=id;UI.threadOpen=true;renderMain();break;
    case "conv-back":UI.threadOpen=false;renderMain();break;
    case "goto-conv":UI.conv=id;UI.threadOpen=true;UI.view="conversas";UI.line="";UI.lead=null;render();break;
    case "assume":case "take":
      L.ai=false;L.needsHuman=false;L.history.unshift({kind:"note",text:`${L.owner} assumiu a conversa e a IA foi pausada.`,at:nowIso(),by:L.owner});
      if(a==="take"){UI.conv=id;UI.threadOpen=true;UI.view="conversas";UI.line="";UI.lead=null}
      save();render();toast(`Você assumiu a conversa com ${first(L.name)}. A IA foi pausada.`);break;
    case "return-ai":L.ai=true;L.history.unshift({kind:"note",text:"Conversa devolvida para a IA.",at:nowIso(),by:L.owner});save();render();toast(`A IA voltou a responder ${first(L.name)}.`);break;
    case "send":{
      const t=document.getElementById("reply");const txt=t.value.trim();if(!txt)return;
      const now=nowIso();L.msgs.push({from:"human",text:txt,at:now,by:L.owner});
      const wasAi=L.ai;L.ai=false;L.needsHuman=false;L.lastContact=now;L.updated=now;save();render();
      toast(wasAi?"Mensagem enviada. A IA foi pausada nesta conversa.":"Mensagem enviada.");break}
    case "send-tpl":{
      const tp=tplsOf(L.co).filter(t=>t.status==="Aprovado");const t=tp.find(x=>x.id===(UI.tplPick[L.id]||(tp[0]&&tp[0].id)));if(!t)return;
      const now=nowIso();L.msgs.push({from:"human",text:fillTpl(t,L),at:now,by:L.owner,tpl:t.name});L.ai=false;L.lastContact=now;L.updated=now;
      L.history.unshift({kind:"note",text:`Modelo “${t.name}” enviado.`,at:now,by:L.owner});
      save();render();toast(`Modelo enviado. A conversa reabre quando ${first(L.name)} responder. Custo estimado ${cost(TPL_COST[t.cat])}.`);break}
    case "idle":UI.idle=+id;UI.sel={};renderMain();break;
    case "react-start":{const ids=leadsOf().filter(l=>UI.sel[l.id]&&kindOf(l)==="open"&&!l.needsHuman&&l.channel==="whatsapp"&&daysSince(l.lastContact)>=UI.idle).map(l=>l.id);
      const tp=tplsOf().filter(t=>t.status==="Aprovado");const mk=tp.find(t=>t.cat==="Marketing")||tp[0];UI.react={ids,tpl:mk?mk.id:null};renderMain();break}
    case "react-cancel":UI.react=null;renderMain();break;
    case "react-send":{
      const t=tplsOf().find(x=>x.id===UI.react.tpl&&x.status==="Aprovado");if(!t)return;
      const now=Date.now();UI.react.ids.forEach((lid,i)=>{const l=byId(lid);if(!l)return;const at=new Date(now+i*1000).toISOString();
        l.msgs.push({from:"human",text:fillTpl(t,l),at,by:l.owner,tpl:t.name});l.lastContact=at;
        l.history.unshift({kind:"note",text:`Reativação com o modelo “${t.name}”.`,at,by:l.owner})});
      const n=UI.react.ids.length;UI.react=null;UI.sel={};save();render();toast(`${n} ${n===1?"modelo enviado":"modelos enviados"}. Custo estimado ${cost(n*TPL_COST[t.cat])}.`);break}
    case "add-task":{
      const text=document.getElementById("ntText").value.trim();const dt=document.getElementById("ntDate").value;if(!text||!dt){toast("Descreva a tarefa e escolha o prazo.");return}
      S.tasks.push({id:uid("t"),co:S.co,lead:document.getElementById("ntLead").value,text,due:new Date(dt+"T12:00").toISOString(),owner:document.getElementById("ntOwner").value,done:false});
      save();render();toast("Tarefa adicionada.");break}
    case "add-dtask":{
      const l=byId(UI.lead);const text=document.getElementById("dtText").value.trim();const dt=document.getElementById("dtDate").value;if(!text||!dt)return;
      S.tasks.push({id:uid("t"),co:l.co,lead:l.id,text,due:new Date(dt+"T12:00").toISOString(),owner:l.owner,done:false});
      save();render();toast("Tarefa adicionada.");break}
    case "add-note":{
      const l=byId(UI.lead);const t=document.getElementById("noteText").value.trim();if(!t)return;
      l.history.unshift({kind:"note",text:t,at:nowIso(),by:l.owner});save();renderDrawer();break}
    case "rm-int":{const l=byId(UI.lead);l.interest=l.interest.filter(x=>x!==id);save();render();break}
    case "mark-won":moveLead(id,pipeOf(L).stages.find(s=>s.kind==="won").id);break;
    case "mark-lost":moveLead(id,pipeOf(L).stages.find(s=>s.kind==="lost").id);break;
    case "del-lead":
      modal(`<h2>Excluir ${esc(L.name)}?</h2><p class="muted" style="margin:0">O histórico, as conversas e as tarefas deste lead serão apagados.</p><div class="acts"><button class="btn" data-action="modal-close">Cancelar</button><button class="btn primary" style="background:var(--lost);box-shadow:none" data-action="del-confirm" data-id="${id}">Excluir lead</button></div>`);break;
    case "del-confirm":S.leads=S.leads.filter(x=>x.id!==id);S.tasks=S.tasks.filter(t=>t.lead!==id);UI.lead=null;if(UI.conv===id)UI.conv=null;closeModal();save();render();toast("Lead excluído.");break;
    case "add-rule":{
      const text=document.getElementById("nrText").value.trim();if(!text){toast("Descreva a tarefa que a regra vai criar.");return}
      S.rules.push({id:uid("r"),co:S.co,pipe:document.getElementById("nrPipe").value,stage:document.getElementById("nrStage").value,text,days:Math.max(0,parseInt(document.getElementById("nrDays").value)||0),on:true});
      save();renderMain();toast("Regra criada e ativa.");break}
    case "del-rule":S.rules=S.rules.filter(r=>r.id!==id);save();renderMain();toast("Regra excluída.");break;
    case "num-connect":{const x=numById(id);
      modal(`<h2>Conectar “${esc(x.label)}” pela API oficial</h2>
        <p class="muted" style="margin:0">No sistema real, este botão abre o cadastro guiado da Meta. Antes, tenha em mãos:</p>
        <ol class="steps"><li>Gerenciador de Negócios da ${esc(CO().name)} verificado com o CNPJ</li><li>O número que vai ser usado, recebendo SMS ou ligação para o código</li><li>O nome de exibição que aparece para o cliente</li><li>A decisão de manter ou não o app WhatsApp Business no mesmo número (coexistência)</li><li>Uma forma de pagamento na conta da Meta, para os modelos de mensagem</li></ol>
        <label class="field"><span>Número para o protótipo</span><input id="numPhone" inputmode="tel" placeholder="(86) 99999-0000"></label>
        <p id="numErr" style="color:var(--bad-fg);font-size:13px;margin:0" hidden></p>
        <div class="acts"><button class="btn" data-action="modal-close">Cancelar</button><button class="btn primary" data-action="num-confirm" data-id="${id}">Simular conexão</button></div>`);break}
    case "num-confirm":{const x=numById(id);const ph=document.getElementById("numPhone").value.trim();
      if(ph.replace(/\D/g,"").length<10){const er=document.getElementById("numErr");er.hidden=false;er.textContent="Informe o número com DDD.";return}
      x.phone=ph;x.status="connected";x.quality="Alta";x.since=nowIso();x.used=0;save();closeModal();render();toast(`Número “${x.label}” conectado.`);break}
    case "num-off":{const x=numById(id);modal(`<h2>Desconectar “${esc(x.label)}”?</h2><p class="muted" style="margin:0">As conversas continuam no CRM, mas ninguém consegue responder por este número até ele ser conectado de novo.</p><div class="acts"><button class="btn" data-action="modal-close">Cancelar</button><button class="btn primary" style="background:var(--lost);box-shadow:none" data-action="num-off-confirm" data-id="${id}">Desconectar</button></div>`);break}
    case "num-off-confirm":{const x=numById(id);x.status="off";x.phone="";x.since=null;x.used=0;save();closeModal();render();toast("Número desconectado.");break}
    case "num-rename":{const x=numById(id);modal(`<h2>Renomear número</h2><label class="field"><span>Nome interno</span><input id="numLabel" value="${esc(x.label)}" placeholder="Ex.: Locação e CPAP"></label><div class="acts"><button class="btn" data-action="modal-close">Cancelar</button><button class="btn primary" data-action="num-rename-ok" data-id="${id}">Salvar nome</button></div>`);break}
    case "num-rename-ok":{const x=numById(id);const v=document.getElementById("numLabel").value.trim();if(!v)return;x.label=v;save();closeModal();render();toast("Nome salvo.");break}
    case "tpl-new":
      modal(`<h2>Novo modelo de mensagem</h2><p class="muted" style="margin:0">Use {{nome}}, {{vendedor}} e {{produto}} para os campos que mudam. Depois de enviado, a Meta revisa e aprova.</p>
        <label class="field"><span>Nome do modelo</span><input id="tplName" placeholder="Ex.: lembrete_devolucao"></label>
        <label class="field"><span>Categoria</span><select id="tplCat"><option>Utilidade</option><option>Marketing</option></select></label>
        <label class="field"><span>Texto</span><textarea id="tplText" rows="4" placeholder="Olá, {{nome}}! ..."></textarea></label>
        <p class="muted" style="margin:0;font-size:12.5px">Utilidade é para avisos de pedido, entrega e contrato. Qualquer oferta ou convite para comprar entra como Marketing, que custa mais.</p>
        <div class="acts"><button class="btn" data-action="modal-close">Cancelar</button><button class="btn primary" data-action="tpl-save">Enviar para aprovação</button></div>`);break;
    case "tpl-save":{const nm=document.getElementById("tplName").value.trim().toLowerCase().replace(/[^a-z0-9_]+/g,"_");const tx=document.getElementById("tplText").value.trim();
      if(!nm||!tx){toast("Preencha o nome e o texto do modelo.");return}
      S.templates.push({id:uid("t-"),co:S.co,name:nm,cat:document.getElementById("tplCat").value,status:"Em análise",text:tx});save();closeModal();renderMain();toast("Modelo enviado para aprovação.");break}
    case "tpl-approve":{const t=S.templates.find(x=>x.id===id);t.status="Aprovado";save();renderMain();toast(`Modelo “${t.name}” aprovado.`);break}
    case "int-open":{const it=INTEGRATIONS.find(x=>x.k===id);const on=!!(S.integrations[S.co]||{})[id];
      modal(`<h2>${it.name}</h2><p class="muted" style="margin:0">${it.desc}</p><div><b style="font-size:13px">O que é preciso</b><ol class="steps" style="margin-top:8px">${it.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>
        <div class="acts"><button class="btn" data-action="modal-close">Fechar</button><button class="btn primary" data-action="int-toggle" data-id="${id}">${on?"Marcar como não configurado":"Simular configuração"}</button></div>`);break}
    case "int-toggle":{S.integrations[S.co]=S.integrations[S.co]||{};S.integrations[S.co][id]=!S.integrations[S.co][id];save();closeModal();renderMain();toast(S.integrations[S.co][id]?"Integração marcada como configurada.":"Integração marcada como não configurada.");break}
    case "reset":
      modal(`<h2>Restaurar os dados de exemplo?</h2><p class="muted" style="margin:0">Tudo o que foi alterado neste protótipo volta ao estado inicial.</p><div class="acts"><button class="btn" data-action="modal-close">Cancelar</button><button class="btn primary" data-action="reset-confirm">Restaurar exemplos</button></div>`);break;
    case "reset-confirm":S=seed();UI.lead=null;UI.conv=null;UI.react=null;UI.sel={};save();closeModal();render();toast("Dados de exemplo restaurados.");break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fOwner"){UI.owner=t.value;renderMain();return}
  if(t.id==="fTemp"){UI.temp=t.value;renderMain();return}
  if(t.id==="fLine"){UI.line=t.value;UI.conv=null;renderMain();return}
  if(t.id==="tOwner"){UI.taskFilter=t.value;renderMain();return}
  if(t.id==="tplPick"){UI.tplPick[t.dataset.lead]=t.value;renderMain();return}
  if(t.id==="reactTpl"){UI.react.tpl=t.value;renderMain();return}
  if(t.id==="nrPipe"){UI.rulePipe=t.value;document.getElementById("nrStage").innerHTML=CO().pipelines[t.value].stages.filter(s=>s.kind!=="lost").map(s=>`<option value="${s.id}">${s.name}</option>`).join("");return}
  if(t.dataset.sel){UI.sel[t.dataset.sel]=t.checked;renderMain();return}
  if(t.dataset.task){const tk=S.tasks.find(x=>x.id===t.dataset.task);if(tk){tk.done=t.checked;save();render();if(t.checked)toast("Tarefa concluída.")}return}
  if(t.dataset.rule){const r=S.rules.find(x=>x.id===t.dataset.rule);if(r){r.on=t.checked;save();toast(r.on?"Regra ativada.":"Regra desativada.")}return}
  const l=UI.lead&&byId(UI.lead);if(!l)return;
  if(t.id==="addInt"&&t.value){l.interest.push(t.value);const x=prod(l.co,t.value);if(!(+l.value)&&x)l.value=(l.pipe==="locacao"&&x.rent)?x.rent:x.price;save();render();return}
  if(t.dataset.f){
    const k=t.dataset.f;
    if(k==="stage"){moveLead(l.id,t.value);return}
    if(k==="pipe"){l.pipe=t.value;l.stage=pipeOf(l).stages[0].id;l.closedAt=null;l.lostReason="";l.history.unshift({kind:"stage",text:`Movido para o funil ${pipeOf(l).name}`,at:nowIso(),by:"Você"});save();render();return}
    if(k==="channel"){l.channel=t.value;l.line=t.value==="whatsapp"?(l.line||numsOf(l.co)[0].id):null;save();render();return}
    l[k]=k==="value"?(parseFloat(t.value)||0):t.value;l.updated=nowIso();save();render();return}
  if(t.dataset.cf){l.fields[t.dataset.cf]=t.type==="number"?(parseFloat(t.value)||0):t.value;save();render()}
});
function refocus(elId,pos){const n=document.getElementById(elId);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){UI.q=t.value;const pos=t.selectionStart;renderMain();refocus("q",pos)}
  else if(t.id==="prodQ"){UI.prodQ=t.value;const pos=t.selectionStart;renderMain();refocus("prodQ",pos)}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(document.getElementById("modalWrap").classList.contains("on"))closeModal();else if(UI.lead){UI.lead=null;renderDrawer()}}
  if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="reply"){e.preventDefault();const b=document.querySelector('[data-action="send"]');if(b)b.click()}
});
document.getElementById("modalWrap").addEventListener("click",e=>{if(e.target.id==="modalWrap")closeModal()});
try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(!storedTheme()){renderSide();renderMain()}})}catch(_){}

applyTheme();load();render();
</script>
</body>
</html>
