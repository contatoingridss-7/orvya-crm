<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orvya · Conexões inteligentes. Resultados integrados.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7C5CFF;--accent-dk:#6A45F5;--grad:linear-gradient(135deg,#6D4AFF 0%,#9B7BFF 100%);
  --won:#10B981;--lost:#EF4444;--amber:#F59E0B;
  --bg:#F4F4F7;--side:#FFFFFF;--surface:#FFFFFF;--surface-2:#F8F8FB;--raise:#FFFFFF;--line:#E7E7EE;--line-2:#D9D9E3;
  --ink:#16161D;--muted:#6E6E7C;--tint:#F1EEFF;--tint-ink:#5B3FE0;--title:#0D0D12;
  --ok-bg:rgba(16,185,129,.12);--ok-fg:#047857;--bad-bg:rgba(239,68,68,.10);--bad-fg:#DC2626;--warn-bg:rgba(245,158,11,.15);--warn-fg:#B45309;
  --glow:radial-gradient(1100px 520px at 55% 118%,rgba(124,92,255,.16),transparent 70%);
  --shadow:0 1px 2px rgba(16,16,29,.04),0 8px 24px rgba(16,16,29,.05);--shadow-lg:0 30px 80px rgba(16,16,29,.22);
  --toast:#15151C;--scrim:rgba(10,10,20,.35);
  --r:16px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07070A;--side:#0C0C11;--surface:#111117;--surface-2:#16161E;--raise:#1C1C26;--line:#22222C;--line-2:#30303D;
    --ink:#EDEDF2;--muted:#8B8B9A;--tint:rgba(124,92,255,.15);--tint-ink:#BBA8FF;--title:#FFFFFF;
    --ok-bg:rgba(16,185,129,.15);--ok-fg:#34D399;--bad-bg:rgba(239,68,68,.15);--bad-fg:#F87171;--warn-bg:rgba(245,158,11,.15);--warn-fg:#FBBF24;
    --glow:radial-gradient(1000px 520px at 60% 122%,rgba(124,92,255,.45),transparent 65%),radial-gradient(700px 420px at 100% 105%,rgba(168,85,247,.22),transparent 70%);
    --shadow:none;--shadow-lg:0 30px 80px rgba(0,0,0,.65);--toast:#1D1D28;--scrim:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07070A;--side:#0C0C11;--surface:#111117;--surface-2:#16161E;--raise:#1C1C26;--line:#22222C;--line-2:#30303D;
  --ink:#EDEDF2;--muted:#8B8B9A;--tint:rgba(124,92,255,.15);--tint-ink:#BBA8FF;--title:#FFFFFF;
  --ok-bg:rgba(16,185,129,.15);--ok-fg:#34D399;--bad-bg:rgba(239,68,68,.15);--bad-fg:#F87171;--warn-bg:rgba(245,158,11,.15);--warn-fg:#FBBF24;
  --glow:radial-gradient(1000px 520px at 60% 122%,rgba(124,92,255,.45),transparent 65%),radial-gradient(700px 420px at 100% 105%,rgba(168,85,247,.22),transparent 70%);
  --shadow:none;--shadow-lg:0 30px 80px rgba(0,0,0,.65);--toast:#1D1D28;--scrim:rgba(0,0,0,.6);color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{color:var(--title);margin:0;line-height:1.15;letter-spacing:-.02em}
.app{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr);background:var(--glow),var(--bg)}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 14px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(124,92,255,.35)}
.mark svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.brand strong{display:block;font-size:19px;font-weight:700;color:var(--title);letter-spacing:-.035em;line-height:1.1}
.brand .slogan{display:block;font-size:10.5px;color:var(--muted);line-height:1.35;margin-top:2px;max-width:170px}
.signature{margin:6px 4px 0;font-size:10.5px;letter-spacing:.18em;color:var(--muted);font-weight:600}
.signature b{letter-spacing:.02em;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.co-switch{display:grid;gap:6px;margin-bottom:20px}
.co-btn{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left;transition:border-color .15s,background .15s}
.co-btn:hover{border-color:var(--line-2)}
.co-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.mono{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:11.5px;background:var(--accent);color:#fff}
.co-btn[data-co="loc"] .mono{background:#14B8A6}
.co-btn b{display:block;font-size:13px;font-weight:600;line-height:1.2;color:var(--title)}
.co-btn small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:10px;padding:8px 10px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(124,92,255,.3)}
.nav svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:auto;background:var(--tint);color:var(--tint-ink);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.nav .count.alert{background:var(--bad-bg);color:var(--bad-fg)}
.nav button[aria-current="page"] .count{background:rgba(255,255,255,.22);color:#fff}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{margin-top:auto;padding-top:16px;display:grid;gap:8px}
.side-foot button{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--muted);text-align:left}
.side-foot button:hover{color:var(--ink);border-color:var(--line-2)}
.proto{font-size:11px;color:var(--muted);padding:2px 4px 0;line-height:1.4;margin:0}

/* Main */
.main{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.03em}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.top .spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:260px;height:40px}
.search svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:0 16px;height:40px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap;transition:border-color .15s,background .15s,filter .15s}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(124,92,255,.32)}
.btn.primary:hover{filter:brightness(1.07);background:var(--grad)}
.btn.soft{background:var(--tint);border-color:transparent;color:var(--tint-ink)}
.btn.sm{height:32px;padding:0 11px;font-size:12px;border-radius:9px;box-shadow:none}
.btn.ghost{background:none;border-color:transparent}
.btn.danger:hover{border-color:var(--lost);color:var(--bad-fg)}
.btn:disabled{opacity:.45;pointer-events:none}
.content{padding:24px 28px 44px;flex:1;min-width:0}

/* Genéricos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:15px;font-weight:650;margin-bottom:3px}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-3-1{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad-fg);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:transparent}
.pill.ind{background:var(--tint);color:var(--tint-ink);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.t-quente{background:#EF4444}.t-morno{background:#F59E0B}.t-frio{background:#94A3B8}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--tint-ink);font-weight:700;font-size:11px}
.muted{color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line-2);border-radius:var(--r)}
.row-list{display:grid}
.row-list>*{border-top:1px solid var(--line)}
.row-list>*:first-child{border-top:0}
.link{background:none;border:0;padding:0;color:var(--tint-ink);font-weight:600;text-align:left}
.link:hover{text-decoration:underline}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.field{display:grid;gap:4px;min-width:0}
.field span{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea,.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:38px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--accent)}
textarea{resize:vertical}
select option{background:var(--surface);color:var(--ink)}

/* Painel */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi strong{display:block;font-size:24px;font-weight:700;color:var(--title);margin-top:4px;line-height:1.2;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hl{background:linear-gradient(160deg,#2B1A66 0%,#5B3BF0 70%,#8E6BFF 100%);border-color:transparent;box-shadow:0 16px 40px rgba(91,59,240,.35)}
.kpi.hl span,.kpi.hl em{color:rgba(255,255,255,.75)}.kpi.hl strong{color:#fff}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:140px minmax(0,1fr) 100px;align-items:center;gap:10px;font-size:13px}
.bar .track{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;border-radius:6px;background:var(--grad)}
.bar .fill.won{background:var(--won)}.bar .fill.lost{background:#F87171}
.bar .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.pipe-block+.pipe-block{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.pipe-block h3{font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;font-weight:650}
.pipe-block h3 span{font-weight:500;color:var(--muted);font-size:12px}
.origin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;padding:10px 0}
.origin b{font-weight:600}
.origin .track{grid-column:1/-1;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:flex}
.origin .track i{display:block;height:100%}
.origin small{color:var(--muted);font-size:12px;text-align:right}
.att{display:flex;align-items:center;gap:12px;padding:11px 0}
.att .grow{flex:1;min-width:0}
.att b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att small{color:var(--muted);font-size:12px}

/* Kanban */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:none;border-radius:9px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--grad);color:#fff}
.toolbar select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;-webkit-overflow-scrolling:touch}
.col{flex:none;width:282px;background:color-mix(in srgb,var(--surface) 60%,transparent);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 220px);min-height:240px;backdrop-filter:blur(8px)}
.col.over{border-color:var(--accent);background:var(--tint)}
.col-head{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.col-head .t{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px;color:var(--title)}
.col-head .t .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.col-head small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.col-head .stripe{height:3px;border-radius:3px;margin-top:10px;background:var(--grad)}
.col[data-kind="won"] .stripe{background:var(--won)}
.col[data-kind="lost"] .stripe{background:#F87171}
.col-body{padding:10px;display:grid;gap:8px;overflow-y:auto;align-content:start;flex:1}
.kcard{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:grab;display:grid;gap:7px;transition:border-color .15s,box-shadow .15s;text-align:left;width:100%}
.kcard:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(124,92,255,.15)}
.kcard.dragging{opacity:.4}
.kcard.need{box-shadow:inset 3px 0 0 var(--lost)}
.kcard .l1{display:flex;align-items:center;gap:7px;min-width:0}
.kcard .l1 b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--title)}
.kcard .org{font-size:12px;color:var(--muted);margin-top:-4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .l3{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kcard .val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--title);font-size:13px}
.kcard .meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.kcard .meta .av{width:22px;height:22px;font-size:9px}
.kcard .meta .r{margin-left:auto}

/* Conversas */
.inbox{display:grid;grid-template-columns:330px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;height:calc(100vh - 150px);min-height:500px;box-shadow:var(--shadow)}
.conv-side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.conv-filter{padding:10px;border-bottom:1px solid var(--line)}
.conv-filter select{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px}
.conv-list{overflow-y:auto;flex:1}
.conv{display:flex;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;align-items:flex-start}
.conv:hover{background:var(--surface-2)}
.conv[aria-current="true"]{background:var(--tint)}
.conv .grow{flex:1;min-width:0}
.conv .l1{display:flex;gap:6px;align-items:baseline}
.conv .l1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--title)}
.conv .l1 small{color:var(--muted);font-size:11px;white-space:nowrap}
.conv p{margin:2px 0 5px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .tags{display:flex;gap:4px;flex-wrap:wrap}
.ch{font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--muted);white-space:nowrap;flex:none;border:1px solid var(--line)}
.ch.whatsapp{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.ch.instagram{background:rgba(236,72,153,.14);color:#DB2777;border-color:transparent}
.ch.messenger{background:rgba(59,130,246,.14);color:#3B82F6;border-color:transparent}
.thread{display:flex;flex-direction:column;min-width:0;min-height:0}
.th-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.th-head .grow{flex:1;min-width:140px}
.th-head b{display:block;font-weight:600;color:var(--title)}
.th-head small{color:var(--muted);font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.summary{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:6px}
.summary b{display:block;font-size:12px;color:var(--tint-ink);margin-bottom:2px}
.bub{max-width:min(78%,520px);padding:8px 12px;border-radius:16px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.bub small{display:block;font-size:10.5px;opacity:.7;margin-top:3px}
.bub.lead{align-self:flex-start;background:var(--raise);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.ai{align-self:flex-end;background:var(--tint);border-bottom-right-radius:5px}
.bub.human{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:5px}
.bub.tpl{border:1px dashed rgba(255,255,255,.5)}
.win{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;border-top:1px solid var(--line);color:var(--muted)}
.win.closed{background:var(--warn-bg);color:var(--warn-fg)}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.composer textarea{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:42px;max-height:140px;background:var(--surface-2);outline:none}
.composer textarea:focus{border-color:var(--accent)}
.composer select{flex:1;min-width:180px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px}
.tpl-prev{flex-basis:100%;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)}
.ai-note{font-size:11.5px;color:var(--muted);padding:0 14px 10px;margin:0}

/* Fila e tarefas */
.q-item{display:flex;align-items:center;gap:12px;padding:13px 0;flex-wrap:wrap}
.q-item .grow{flex:1;min-width:200px}
.q-item b{font-weight:600;color:var(--title)}
.q-item p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.score{font-weight:700;font-size:16px;color:var(--title);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.score small{display:block;font-weight:500;font-size:10px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.draft{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;background:var(--surface-2)}
.draft p{margin:0;font-size:13px}
.check{display:flex;align-items:center;gap:10px}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.task{display:flex;align-items:center;gap:12px;padding:11px 0;flex-wrap:wrap}
.task .grow{flex:1;min-width:180px}
.task.done .grow b{text-decoration:line-through;color:var(--muted)}
.task b{font-weight:600}
.task small{display:block;color:var(--muted);font-size:12px}
.group-h{display:flex;align-items:center;gap:8px;margin:18px 0 4px;font-size:13px;font-weight:650;color:var(--title)}
.new-task{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 150px 130px auto;gap:8px;align-items:end}
.cost{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--tint);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.cost b{color:var(--tint-ink)}

/* Tabelas */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stock-low{color:var(--bad-fg);font-weight:600}

/* Canais */
.num-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.num-card.on::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:140px;background:radial-gradient(closest-side,rgba(124,92,255,.35),transparent);pointer-events:none}
.num-card .h{display:flex;align-items:flex-start;gap:12px}
.num-card .h .grow{flex:1;min-width:0}
.num-card h3{font-size:15px;font-weight:650}
.num-card .phone{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--title);font-variant-numeric:tabular-nums}
.num-card .phone.off{color:var(--muted);font-weight:500;font-size:14px}
.meter{display:grid;gap:5px}
.meter .l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.meter .track{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter .track i{display:block;height:100%;background:var(--grad);border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stats span{display:block;font-size:11px;color:var(--muted)}
.stats b{font-size:14px;color:var(--title)}
.int{display:flex;gap:12px;align-items:flex-start;padding:14px 0}
.int .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.int .grow{flex:1;min-width:0}
.int b{display:block;font-weight:600;color:var(--title)}
.int p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:13.5px}

/* Automações */
.rule{display:flex;align-items:center;gap:14px;padding:14px 0}
.rule .grow{flex:1;min-width:0}
.rule p{margin:0;font-size:13.5px}
.rule p em{font-style:normal;font-weight:600;color:var(--title)}
.rule small{color:var(--muted);font-size:12px}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.new-rule{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,1.6fr) 100px auto;gap:8px;align-items:end}

/* Drawer e modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.dr-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-head .av{width:44px;height:44px;font-size:14px;background:var(--grad);color:#fff}
.dr-head .grow{flex:1;min-width:0}
.dr-head h2{font-size:19px}
.dr-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.dr-body{flex:1;overflow-y:auto;padding:16px 20px 24px;display:grid;gap:20px;align-content:start}
.dr-sec h3{font-size:13px;font-weight:650;margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.ai-box{background:var(--tint);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.ai-box .l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ai-box p{margin:0;font-size:13px}
.tl{display:grid;gap:10px}
.tl-item{display:grid;grid-template-columns:10px 1fr;gap:10px}
.tl-item i{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:5px}
.tl-item.stage i{background:var(--won)}
.tl-item.auto i{background:var(--amber)}
.tl-item p{margin:0;font-size:13px}
.tl-item small{color:var(--muted);font-size:11.5px}
.dr-foot{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap}
.modal-wrap{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:20px;background:var(--scrim);backdrop-filter:blur(3px)}
.modal-wrap.on{display:grid}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow-y:auto;padding:22px;box-shadow:var(--shadow-lg);display:grid;gap:14px}
.modal h2{font-size:19px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:18px;z-index:40;display:grid;gap:8px;max-width:min(380px,calc(100% - 36px))}
.toast{background:var(--toast);color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;box-shadow:var(--shadow-lg);border-left:3px solid var(--accent);animation:tin .25s ease}
.toast.auto{border-left-color:var(--amber)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Responsivo */
@media (max-width:1240px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g-3-1{grid-template-columns:1fr}.g-3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{padding:12px 12px 8px;overflow:hidden;min-width:0;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 4px 10px}
  .brand .slogan{max-width:none}
  .co-switch{grid-template-columns:1fr 1fr;margin-bottom:10px}
  .co-btn small{display:none}
  .nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .nav button{flex:none;width:auto;padding:7px 11px}
  .nav .sep{display:none}
  .side-foot,.proto{display:none}
  .top{padding:12px 16px;position:static}
  .top h1{font-size:20px}
  .search{min-width:0;flex:1}
  .content{padding:16px 16px 32px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2,.g-3{grid-template-columns:1fr}
  .bar{grid-template-columns:96px minmax(0,1fr) 84px}
  .col{max-height:none;width:266px}
  .inbox{grid-template-columns:1fr;height:calc(100vh - 250px)}
  .inbox.thread-open .conv-side{display:none}
  .inbox:not(.thread-open) .thread{display:none}
  .new-task,.new-rule{grid-template-columns:1fr 1fr}
  .new-task .full,.new-rule .full{grid-column:1/-1}
  .fgrid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}
}
@media (min-width:901px){.only-mobile{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  if(s<86400) return "há "+Math.floor(s/3600)+" h";
  const d=Math.floor(s/86400); return d===1?"ontem":"há "+d+" dias";
}

function dayDiff(iso){const a=new Date(iso);a.setHours(0,0,0,0);const b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/DAY)}

  const d=dayDiff(iso);

function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
const UI={view:"painel",q:"",lead:null,conv:null,threadOpen:false,owner:"",temp:"",idle:7,sel:{},react:null,tplPick:{},taskFilter:"",prodQ:"",rulePipe:null,line:""};

const CO=()=>COMPANIES[S.co];
const leadsOf=()=>S.leads.filter(l=>l.co===S.co);
const byId=id=>S.leads.find(l=>l.id===id);
const pipeOf=l=>COMPANIES[l.co].pipelines[l.pipe];
const stageOf=l=>pipeOf(l).stages.find(s=>s.id===l.stage)||pipeOf(l).stages[0];
const kindOf=l=>stageOf(l).kind;
const prod=(co,pid)=>(S.products[co]||[]).find(p=>p.id===pid);
const numsOf=co=>S.numbers.filter(x=>x.co===(co||S.co));
const numById=id=>S.numbers.find(x=>x.id===id);
const tplsOf=co=>S.templates.filter(t=>t.co===(co||S.co));
const matchQ=l=>{const q=UI.q.trim().toLowerCase();if(!q)return true;const qd=q.replace(/\D/g,"");return (l.name+" "+l.org+" "+l.phone).toLowerCase().includes(q)||(qd.length>=3&&l.phone.replace(/\D/g,"").includes(qd))};
const tasksOf=()=>S.tasks.filter(t=>t.co===S.co);
const overdue=()=>tasksOf().filter(t=>!t.done&&dayDiff(t.due)<0);
const needList=()=>leadsOf().filter(l=>l.needsHuman&&kindOf(l)==="open");
const chLabel=c=>({whatsapp:"WhatsApp",instagram:"Instagram",messenger:"Messenger"})[c]||c;
const lastIn=l=>{for(let i=l.msgs.length-1;i>=0;i--)if(l.msgs[i].from==="lead")return l.msgs[i];return null};
const windowOpen=l=>{if(l.channel!=="whatsapp")return true;const m=lastIn(l);return !!m&&(Date.now()-new Date(m.at).getTime())<24*HOUR};
const windowEnds=l=>{const m=lastIn(l);return m?new Date(new Date(m.at).getTime()+24*HOUR).toISOString():null};
function fillTpl(t,l){const p=l.interest.map(x=>prod(l.co,x)).filter(Boolean)[0];
  return t.text.replace(/{{nome}}/g,first(l.name)).replace(/{{vendedor}}/g,l.owner).replace(/{{produto}}/g,p?lc1(p.name):"o equipamento")}

/* ============ Tema ============ */
function storedTheme(){try{return localStorage.getItem("orvya-theme")}catch(e){return null}}
function effectiveTheme(){const s=storedTheme();if(s==="light"||s==="dark")return s;return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function applyTheme(){const s=storedTheme();if(s==="light"||s==="dark")document.documentElement.setAttribute("data-theme",s);else document.documentElement.removeAttribute("data-theme")}
function toggleTheme(){const nx=effectiveTheme()==="dark"?"light":"dark";try{localStorage.setItem("orvya-theme",nx)}catch(e){}applyTheme();renderSide();renderMain()}

/* ============ Render ============ */
function render(){renderSide();renderMain();renderDrawer()}

/* ---------- Painel ---------- */
function vPainel(){
  const ls=leadsOf().filter(matchQ);
  const open=ls.filter(l=>kindOf(l)==="open"),won=ls.filter(l=>kindOf(l)==="won"),lost=ls.filter(l=>kindOf(l)==="lost");
  const inMonth=l=>l.closedAt&&daysSince(l.closedAt)<30;
  const wonM=won.filter(inMonth),lostM=lost.filter(inMonth);
  const pipelineValue=open.reduce((a,l)=>a+(+l.value||0),0);
  const conv=(wonM.length+lostM.length)?Math.round(wonM.length/(wonM.length+lostM.length)*100):0;
  const isLoc=S.co==="loc";
  const active=ls.filter(l=>l.pipe==="locacao"&&l.stage==="ativo");
  const mrr=active.reduce((a,l)=>a+(+l.fields.mensal||0),0);
  const kpis=[
    ["Leads em aberto",open.length,`${needList().length} precisam de você agora`],
    ["Valor em negociação",moneyK(pipelineValue),"soma dos leads em aberto"],
    [isLoc?"Fechado em 30 dias":"Vendido em 30 dias",moneyK(wonM.reduce((a,l)=>a+(+l.value||0),0)),`${wonM.length} negócios ganhos`],
    ["Taxa de conversão",conv+"%",`${wonM.length} ganhos e ${lostM.length} perdidos em 30 dias`],
    isLoc?["Receita de locação",money(mrr),`${active.length} contratos ativos por mês`]:["Tarefas atrasadas",overdue().length,"somando toda a equipe"]
  ];
  const pipes=Object.entries(CO().pipelines).map(([pid,p])=>{
    const pl=ls.filter(l=>l.pipe===pid);
    const max=Math.max(1,...p.stages.map(s=>pl.filter(l=>l.stage===s.id).length));
    return `<div class="pipe-block"><h3>${p.name}<span>${pl.filter(l=>kindOf(l)==="open").length} em aberto</span></h3><div class="bars">${p.stages.map(s=>{
      const items=pl.filter(l=>l.stage===s.id);const v=items.reduce((a,l)=>a+(+l.value||0),0);
      return `<div class="bar"><span>${s.name}</span><div class="track"><div class="fill ${s.kind}" style="width:${items.length?Math.max(4,items.length/max*100):0}%"></div></div><span class="val">${items.length} · ${moneyK(v)}</span></div>`}).join("")}</div></div>`}).join("");
  const srcs=CO().sources.map(src=>{const x=ls.filter(l=>l.source===src);const w=x.filter(l=>kindOf(l)==="won");
    return {src,total:x.length,won:w.length,lost:x.filter(l=>kindOf(l)==="lost").length,rev:w.reduce((a,l)=>a+(+l.value||0),0)}}).sort((a,b)=>b.total-a.total);
  const maxS=Math.max(1,...srcs.map(s=>s.total));
  const origins=srcs.map(s=>`<div class="origin"><b>${s.src}</b><small>${s.total} leads, ${s.won} ${s.won===1?"fechado":"fechados"}, ${moneyK(s.rev)}</small>
    <div class="track" style="width:${s.total?Math.max(6,s.total/maxS*100):6}%">${s.total?`<i style="width:${s.won/s.total*100}%;background:var(--won)"></i><i style="width:${s.lost/s.total*100}%;background:#F87171"></i><i style="flex:1;background:var(--accent);opacity:.6"></i>`:""}</div></div>`).join("");
  const stale=open.filter(l=>daysSince(l.lastContact)>=7&&!l.needsHuman);
  const att=[...needList().filter(matchQ).map(l=>({l,why:l.needReason,tag:'<span class="pill bad">Precisa de você</span>'})),...stale.map(l=>({l,why:"Último contato "+rel(l.lastContact),tag:'<span class="pill warn">Parado</span>'}))];
  const attHtml=att.length?`<div class="row-list">${att.slice(0,6).map(({l,why,tag})=>`<div class="att"><span class="av">${initials(l.name)}</span><div class="grow"><b>${esc(l.name)}</b><small>${esc(why)}</small></div>${tag}<button class="btn sm" data-action="open-lead" data-id="${l.id}">Abrir</button></div>`).join("")}</div>`:`<div class="empty">Nada pendente agora.</div>`;
  let contracts="";
  if(isLoc){
    const exp=active.filter(l=>l.fields.fim).map(l=>({l,d:dayDiff(l.fields.fim+"T12:00")})).filter(x=>x.d<=30).sort((a,b)=>a.d-b.d);
    contracts=`<section class="panel"><h2>Contratos de locação vencendo</h2><p class="sub">Próximos 30 dias. Ofereça a renovação antes de a família procurar outra empresa.</p>
      ${exp.length?`<div class="row-list">${exp.map(({l,d})=>`<div class="att"><span class="av">${initials(l.name)}</span><div class="grow"><b>${esc(l.name)}</b><small>${esc(l.fields.equipamento||"")}, ${money(l.fields.mensal)} por mês</small></div>
        <span class="pill ${d<=7?"bad":d<=15?"warn":"ok"}">${d<0?"vencido":d===0?"vence hoje":"vence em "+d+" dias"}</span><button class="btn sm" data-action="open-lead" data-id="${l.id}">Abrir</button></div>`).join("")}</div>`:`<div class="empty">Nenhum contrato vence nos próximos 30 dias.</div>`}</section>`;
  }
  const nums=numsOf();
  const numsHtml=`<section class="panel"><h2>WhatsApp</h2><p class="sub">Conversas iniciadas pelo cliente neste mês. As primeiras ${FREE_SERVICE.toLocaleString("pt-BR")} de cada número não têm custo de mensagem.</p>
    <div class="row-list">${nums.map(x=>`<div class="att"><span class="dot" style="background:${x.status==="connected"?"var(--won)":"var(--line-2)"}"></span><div class="grow"><b>${esc(x.label)}</b><small>${x.status==="connected"?esc(x.phone):"Não conectado"}</small></div>
      ${x.status==="connected"?`<span class="pill ind">${x.used} de ${FREE_SERVICE.toLocaleString("pt-BR")}</span>`:`<button class="btn sm soft" data-action="nav" data-id="canais">Conectar</button>`}</div>`).join("")}</div></section>`;
  return `<div class="kpis">${kpis.map((k,i)=>`<div class="kpi ${i===2?"hl":""}"><span>${k[0]}</span><strong>${k[1]}</strong><em>${k[2]}</em></div>`).join("")}</div>
    <div class="grid g-3-1">
      <div class="grid" style="align-content:start">
        <section class="panel"><h2>Funil por etapa</h2><p class="sub">Quantidade de leads e valor em cada etapa</p>${pipes}</section>
        <section class="panel"><h2>Origem dos leads</h2><p class="sub"><span class="dot" style="background:var(--won)"></span> fechados &nbsp; <span class="dot" style="background:#F87171"></span> perdidos &nbsp; <span class="dot" style="background:var(--accent)"></span> em aberto. É aqui que se mede o retorno de cada campanha.</p><div class="row-list">${origins}</div></section>
      </div>
      <div class="grid" style="align-content:start">
        <section class="panel"><h2>Precisa de atenção</h2><p class="sub">Pedidos de atendimento humano e leads parados há 7 dias ou mais</p>${attHtml}</section>
        ${contracts}
        ${numsHtml}
      </div>
    </div>`;
}

/* ---------- Funil ---------- */
function vFunil(){
  const pid=S.pipe[S.co];const p=CO().pipelines[pid];
  const ls=leadsOf().filter(l=>l.pipe===pid&&matchQ(l)&&(!UI.owner||l.owner===UI.owner)&&(!UI.temp||l.temp===UI.temp));
  const tabs=Object.entries(CO().pipelines).map(([k,x])=>`<button data-action="pipe" data-id="${k}" aria-pressed="${pid===k}">${x.name}</button>`).join("");
  const cols=p.stages.map(s=>{
    const items=ls.filter(l=>l.stage===s.id).sort((a,b)=>(b.needsHuman-a.needsHuman)||(b.score-a.score));
    const v=items.reduce((a,l)=>a+(+l.value||0),0);
    return `<section class="col" data-stage="${s.id}" data-kind="${s.kind}" aria-label="${s.name}">
      <div class="col-head"><div class="t">${s.name}<span class="n">${items.length}</span></div><small>${money(v)}</small><div class="stripe"></div></div>
      <div class="col-body">${items.map(card).join("")||`<p class="muted" style="font-size:12px;text-align:center;margin:12px 0">Arraste um lead para cá</p>`}</div></section>`}).join("");
  return `<div class="toolbar"><div class="tabs" role="group" aria-label="Funis">${tabs}</div>
    <select id="fOwner" aria-label="Filtrar por responsável"><option value="">Todos os responsáveis</option>${CO().team.map(t=>`<option ${UI.owner===t?"selected":""}>${t}</option>`).join("")}</select>
    <select id="fTemp" aria-label="Filtrar por temperatura"><option value="">Todas as temperaturas</option>${["quente","morno","frio"].map(t=>`<option value="${t}" ${UI.temp===t?"selected":""}>${t[0].toUpperCase()+t.slice(1)}</option>`).join("")}</select>
    <span class="muted" style="font-size:12px">${p.hint}</span></div>
    <div class="board">${cols}</div>`;
}
function card(l){
  const open=kindOf(l)==="open";
  const hasOverdue=S.tasks.some(t=>t.lead===l.id&&!t.done&&dayDiff(t.due)<0);
  let extra="";
  if(l.pipe==="locacao"&&l.stage==="ativo"&&l.fields.fim){const d=dayDiff(l.fields.fim+"T12:00");if(d<=15)extra=`<span class="pill ${d<=7?"bad":"warn"}">vence em ${Math.max(d,0)} dias</span>`}
  return `<button class="kcard ${l.needsHuman&&open?"need":""}" draggable="true" data-lead="${l.id}" data-action="open-lead" data-id="${l.id}">
    <div class="l1"><span class="dot t-${l.temp}" title="Temperatura: ${l.temp}"></span><b>${esc(l.name)}</b><span class="ch ${l.channel}">${chLabel(l.channel)}</span></div>
    ${l.org?`<div class="org">${esc(l.org)}</div>`:""}
    <div class="l3"><span class="val">${money(l.value)}</span>${l.type==="B2B"?'<span class="pill">B2B</span>':""}
      ${open&&l.msgs.length?(l.ai?'<span class="pill ind">IA ativa</span>':'<span class="pill">Humano</span>'):""}
      ${l.needsHuman&&open?'<span class="pill bad">Precisa de você</span>':""}${hasOverdue?'<span class="pill warn">Tarefa atrasada</span>':""}${extra}</div>
    <div class="meta"><span class="av">${initials(l.owner)}</span>${esc(l.owner)}<span class="r">${rel(l.lastContact)}</span></div></button>`;
}

let dragId=null,dragged=false;
function bindDnD(){
  document.querySelectorAll(".kcard").forEach(el=>{
    el.addEventListener("dragstart",e=>{dragId=el.dataset.lead;dragged=true;el.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
    el.addEventListener("dragend",()=>{el.classList.remove("dragging");document.querySelectorAll(".col.over").forEach(c=>c.classList.remove("over"));setTimeout(()=>{dragged=false},50)});
  });
  document.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("over")});
    col.addEventListener("dragleave",e=>{if(!col.contains(e.relatedTarget))col.classList.remove("over")});
    col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("over");let lid=dragId;try{lid=lid||e.dataTransfer.getData("text/plain")}catch(_){}dragId=null;if(lid)moveLead(lid,col.dataset.stage)});
  });
}

/* ---------- Movimentação e automações ---------- */
function moveLead(lid,stage,opts={}){
  const l=byId(lid);if(!l||l.stage===stage){renderDrawer();return}
  const target=pipeOf(l).stages.find(s=>s.id===stage);
  if(target.kind==="lost"&&!opts.reason){askLost(lid,stage);return}
  const from=stageOf(l).name;
  l.stage=stage;l.updated=nowIso();
  if(target.kind!=="open"){l.closedAt=nowIso();l.needsHuman=false}else{l.closedAt=null;l.lostReason=""}
  if(target.kind==="lost")l.lostReason=opts.reason;
  l.history.unshift({kind:"stage",text:`Etapa alterada de ${from} para ${target.name}${opts.reason?`. Motivo: ${opts.reason}`:""}`,at:nowIso(),by:"Você"});
  const rules=S.rules.filter(r=>r.on&&r.co===l.co&&r.pipe===l.pipe&&r.stage===stage);
  rules.forEach(r=>{
    S.tasks.push({id:uid("t"),co:l.co,lead:l.id,text:r.text,due:ahead(r.days),owner:l.owner,done:false});
    l.history.unshift({kind:"auto",text:`Automação criou a tarefa “${r.text}” para ${l.owner}`,at:nowIso(),by:"CRM"});
  });
  save();render();
  toast(`${first(l.name)} foi para ${target.name}.`);
  rules.forEach(r=>toast(`Automação: tarefa “${r.text}” criada para ${l.owner}, prazo ${dueLabel(ahead(r.days))}.`,"auto"));
}
function askLost(lid,stage){
  const l=byId(lid);
  modal(`<h2>Por que ${esc(first(l.name))} foi perdido?</h2><p class="muted" style="margin:0">O motivo alimenta o relatório de perdas e ajuda a ajustar preço, estoque e abordagem.</p>
    <div class="chips" id="lostChips">${COMPANIES[l.co].lost.map(r=>`<button class="chip" data-action="lost-pick" data-id="${esc(r)}" aria-pressed="false">${esc(r)}</button>`).join("")}</div>
    <label class="field"><span>Ou descreva outro motivo</span><input id="lostOther" placeholder="Ex.: família decidiu esperar a alta"></label>
    <div class="acts"><button class="btn" data-action="modal-close">Cancelar</button><button class="btn primary" data-action="lost-confirm" data-id="${lid}" data-stage="${stage}">Marcar como perdido</button></div>`);
}

/* ---------- Conversas ---------- */
function vConversas(){
  const nums=numsOf();
  const ls=leadsOf().filter(l=>l.msgs.length&&matchQ(l)&&(!UI.line||(UI.line==="outros"?l.channel!=="whatsapp":l.line===UI.line))).sort((a,b)=>new Date(b.lastContact)-new Date(a.lastContact));
  if(!UI.conv||!ls.find(l=>l.id===UI.conv))UI.conv=ls[0]?ls[0].id:null;
  const filter=`<div class="conv-filter"><select id="fLine" aria-label="Filtrar por número"><option value="">Todos os canais</option>${nums.map(x=>`<option value="${x.id}" ${UI.line===x.id?"selected":""}>WhatsApp: ${esc(x.label)}${x.status==="connected"?"":" (não conectado)"}</option>`).join("")}<option value="outros" ${UI.line==="outros"?"selected":""}>Instagram e Messenger</option></select></div>`;
  const list=ls.map(l=>{const m=l.msgs[l.msgs.length-1];const open=kindOf(l)==="open";const nb=l.line&&numById(l.line);
    return `<button class="conv" data-action="conv" data-id="${l.id}" aria-current="${UI.conv===l.id}"><span class="av">${initials(l.name)}</span><div class="grow">
      <div class="l1"><b>${esc(l.name)}</b><small>${rel(m.at)}</small></div><p>${m.from==="lead"?"":m.from==="ai"?"IA: ":esc(m.by||l.owner)+": "}${esc(m.text)}</p>
      <div class="tags"><span class="ch ${l.channel}">${l.channel==="whatsapp"&&nb?esc(nb.label):chLabel(l.channel)}</span>${l.needsHuman&&open?'<span class="pill bad">Precisa de você</span>':l.ai&&open?'<span class="pill ind">IA respondendo</span>':""}${m.from==="lead"&&open&&!l.needsHuman?'<span class="pill warn">Aguardando resposta</span>':""}</div></div></button>`}).join("")||`<div class="empty" style="margin:14px">Nenhuma conversa encontrada.</div>`;
  const l=UI.conv&&byId(UI.conv);
  let thread=`<div class="empty" style="margin:auto">Selecione uma conversa.</div>`;
  if(l){
    const open=kindOf(l)==="open";const nb=l.line&&numById(l.line);const connected=l.channel!=="whatsapp"||(nb&&nb.status==="connected");
    const win=windowOpen(l);
    let composer;
    if(!connected){
      composer=`<div class="win closed">O número “${esc(nb?nb.label:"")}” ainda não está conectado. Conecte em Canais e integrações para responder por ele.</div>`;
    }else if(win){
      composer=`${l.channel==="whatsapp"?`<div class="win">Janela de atendimento aberta até ${hhmm(windowEnds(l))}. Pode responder livremente, sem custo.</div>`:""}
        <div class="composer"><textarea id="reply" rows="1" placeholder="Responder como ${esc(l.owner)}…" aria-label="Mensagem"></textarea><button class="btn primary" data-action="send" data-id="${l.id}">Enviar</button></div>
        <p class="ai-note">${l.ai&&open?"A IA está respondendo esta conversa. Se você enviar uma mensagem, ela é pausada.":"A IA está pausada nesta conversa. A equipe está no controle."}</p>`;
    }else{
      const tp=tplsOf(l.co).filter(t=>t.status==="Aprovado");const pick=UI.tplPick[l.id]||(tp[0]&&tp[0].id);const t=tp.find(x=>x.id===pick);
      composer=`<div class="win closed">A janela de 24 horas fechou. Pela regra da Meta, só é possível enviar um modelo aprovado até o cliente responder.</div>
        <div class="composer"><select id="tplPick" data-lead="${l.id}" aria-label="Modelo de mensagem">${tp.map(x=>`<option value="${x.id}" ${x.id===pick?"selected":""}>${x.name} (${x.cat})</option>`).join("")}</select>
        <button class="btn primary" data-action="send-tpl" data-id="${l.id}" ${t?"":"disabled"}>Enviar modelo</button>
        ${t?`<div class="tpl-prev">${esc(fillTpl(t,l))}</div>`:""}</div>
        <p class="ai-note">${t?`Custo estimado deste envio: ${cost(TPL_COST[t.cat])} (categoria ${t.cat}).`:"Nenhum modelo aprovado. Crie um em Canais e integrações."}</p>`;
    }
    thread=`<div class="th-head"><button class="btn sm only-mobile" data-action="conv-back">Voltar</button><span class="av">${initials(l.name)}</span>
      <div class="grow"><b>${esc(l.name)}</b><small>${esc(l.phone)} · ${l.channel==="whatsapp"&&nb?"WhatsApp "+esc(nb.label):chLabel(l.channel)} · ${stageOf(l).name}</small></div>
      ${open?(l.ai?`<button class="btn sm" data-action="assume" data-id="${l.id}">Assumir conversa</button>`:`<button class="btn sm soft" data-action="return-ai" data-id="${l.id}">Devolver para IA</button>`):""}
      <button class="btn sm" data-action="open-lead" data-id="${l.id}">Ver lead</button></div>
      <div class="msgs" id="msgs">${l.summary?`<div class="summary"><b>Resumo da IA para a equipe</b>${esc(l.summary)}</div>`:""}
      ${l.msgs.map(m=>`<div class="bub ${m.from} ${m.tpl?"tpl":""}">${esc(m.text)}<small>${m.from==="ai"?"Agente IA":m.from==="human"?esc(m.by||l.owner)+(m.tpl?" · modelo "+esc(m.tpl):""):esc(first(l.name))} · ${new Date(m.at).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</small></div>`).join("")}</div>
      ${composer}`;
  }
  return `<div class="inbox ${UI.threadOpen?"thread-open":""}"><div class="conv-side">${filter}<div class="conv-list">${list}</div></div><div class="thread">${thread}</div></div>`;
}

/* ---------- Fila ---------- */
function vFila(){
  const need=needList().sort((a,b)=>(b.score-a.score)||(new Date(a.lastContact)-new Date(b.lastContact)));
  const needHtml=need.length?`<div class="row-list">${need.map(l=>`<div class="q-item"><div class="score">${l.score}<small>score</small></div>
    <div class="grow"><b>${esc(l.name)}</b> <span class="ch ${l.channel}">${chLabel(l.channel)}</span><p><strong style="color:var(--bad-fg);font-weight:600">${esc(l.needReason)}</strong>, esperando ${rel(l.lastContact)}</p><p>${esc(l.summary)}</p></div>
    <button class="btn sm" data-action="open-lead" data-id="${l.id}">Ver lead</button><button class="btn sm primary" data-action="take" data-id="${l.id}">Assumir</button></div>`).join("")}</div>`
    :`<div class="empty">Nenhuma conversa exige a equipe agora.</div>`;
  const elig=leadsOf().filter(l=>kindOf(l)==="open"&&!l.needsHuman&&l.channel==="whatsapp"&&daysSince(l.lastContact)>=UI.idle).sort((a,b)=>daysSince(b.lastContact)-daysSince(a.lastContact));
  const nSel=elig.filter(l=>UI.sel[l.id]).length;
  const tp=tplsOf().filter(t=>t.status==="Aprovado");
  let react;
  if(UI.react){
    const t=tp.find(x=>x.id===UI.react.tpl)||tp[0];const ids=UI.react.ids;
    react=`<p class="sub">Leads parados estão fora da janela de 24 horas, então a reativação usa um modelo aprovado pela Meta. O texto é fixo; só os campos entre chaves mudam.</p>
      <label class="field" style="margin-bottom:12px"><span>Modelo</span><select id="reactTpl">${tp.map(x=>`<option value="${x.id}" ${t&&x.id===t.id?"selected":""}>${x.name} (${x.cat})</option>`).join("")}</select></label>
      <div class="grid">${ids.map(i=>{const l=byId(i);return `<div class="draft"><div class="check"><span class="av">${initials(l.name)}</span><b>${esc(l.name)}</b><span class="muted" style="font-size:12px">${stageOf(l).name}, último contato ${rel(l.lastContact)}</span></div><p>${t?esc(fillTpl(t,l)):""}</p></div>`}).join("")}</div>
      ${t?`<div class="cost"><span>${ids.length} × ${cost(TPL_COST[t.cat])} (${t.cat})</span><b>Custo estimado: ${cost(ids.length*TPL_COST[t.cat])}</b></div>`:""}
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" data-action="react-cancel">Cancelar</button><button class="btn primary" data-action="react-send" ${t?"":"disabled"}>Enviar para ${ids.length} ${ids.length===1?"lead":"leads"}</button></div>`;
  }else{
    react=`<div class="toolbar" style="margin-bottom:6px"><span class="muted" style="font-size:13px">Sem contato há pelo menos</span><div class="chips">${[2,5,7,14].map(d=>`<button class="chip" data-action="idle" data-id="${d}" aria-pressed="${UI.idle===d}">${d} dias</button>`).join("")}</div></div>
      <p class="sub">Leads de WhatsApp em aberto e sem pedido de atendimento pendente.</p>
      ${elig.length?`<div class="row-list">${elig.map(l=>`<label class="q-item check" style="cursor:pointer"><input type="checkbox" data-sel="${l.id}" ${UI.sel[l.id]?"checked":""}><div class="grow"><b>${esc(l.name)}</b><p>${CO().pipelines[l.pipe].name}, ${stageOf(l).name}. ${esc(l.owner)}, último contato ${rel(l.lastContact)}</p></div><span class="dot t-${l.temp}" title="${l.temp}"></span></label>`).join("")}</div>
      <div style="margin-top:12px"><button class="btn primary" data-action="react-start" ${nSel?"":"disabled"}>${nSel?`Escolher modelo para ${nSel} ${nSel===1?"lead":"leads"}`:"Selecione leads para reativar"}</button></div>`:`<div class="empty">Nenhum lead parado nesse período.</div>`}`;
  }
  return `<div class="grid g-2" style="align-items:start"><section class="panel"><h2>Conversas esperando a equipe</h2><p class="sub">Ordenadas por score e tempo de espera</p>${needHtml}</section>
    <section class="panel"><h2>Reativar leads parados</h2>${react}</section></div>`;
}

/* ---------- Tarefas ---------- */
function vTarefas(){
  const ts=tasksOf().filter(t=>!UI.taskFilter||t.owner===UI.taskFilter);
  const byDue=(a,b)=>new Date(a.due)-new Date(b.due);
  const groups=[["Atrasadas",ts.filter(t=>!t.done&&dayDiff(t.due)<0).sort(byDue)],["Hoje",ts.filter(t=>!t.done&&dayDiff(t.due)===0)],["Próximos dias",ts.filter(t=>!t.done&&dayDiff(t.due)>0).sort(byDue)],["Concluídas",ts.filter(t=>t.done).slice(-6).reverse()]];
  const leadOpts=leadsOf().filter(l=>kindOf(l)!=="lost").map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join("");
  return `<section class="panel" style="margin-bottom:16px"><h2>Nova tarefa</h2><p class="sub">Toda tarefa fica ligada a um lead, para ninguém perder o contexto.</p>
    <div class="new-task"><label class="field full"><span>O que precisa ser feito</span><input id="ntText" placeholder="Ex.: ligar para confirmar a entrega"></label>
    <label class="field"><span>Lead</span><select id="ntLead">${leadOpts}</select></label>
    <label class="field"><span>Prazo</span><input id="ntDate" type="date" value="${isoDate(0)}"></label>
    <label class="field"><span>Responsável</span><select id="ntOwner">${CO().team.map(t=>`<option>${t}</option>`).join("")}</select></label>
    <button class="btn primary" data-action="add-task">Adicionar</button></div></section>
    <section class="panel"><div class="toolbar" style="justify-content:space-between"><h2>Tarefas da equipe</h2>
      <select id="tOwner" aria-label="Filtrar por responsável"><option value="">Todos</option>${CO().team.map(t=>`<option ${UI.taskFilter===t?"selected":""}>${t}</option>`).join("")}</select></div>
      ${groups.map(([g,items],i)=>`<div class="group-h" ${i===0?'style="margin-top:0"':""}>${g} <span class="pill ${g==="Atrasadas"&&items.length?"bad":""}">${items.length}</span></div>
      ${items.length?`<div class="row-list">${items.map(taskRow).join("")}</div>`:`<p class="muted" style="font-size:13px;margin:4px 0 0">Nada aqui.</p>`}`).join("")}</section>`;
}
function taskRow(t){
  const l=byId(t.lead);const d=dayDiff(t.due);
  return `<div class="task ${t.done?"done":""}"><label class="check"><input type="checkbox" data-task="${t.id}" ${t.done?"checked":""} aria-label="Concluir tarefa"></label>
    <div class="grow"><b>${esc(t.text)}</b><small>${l?`<button class="link" data-action="open-lead" data-id="${l.id}">${esc(l.name)}</button> · `:""}${esc(t.owner)}</small></div>
    <span class="pill ${t.done?"ok":d<0?"bad":d===0?"warn":""}">${t.done?"feita":dueLabel(t.due)}</span></div>`;
}

/* ---------- Catálogo ---------- */
function vCatalogo(){
  const isLoc=S.co==="loc";const q=UI.prodQ.toLowerCase();
  const ps=S.products[S.co].filter(p=>!q||(p.name+" "+(p.code||"")+" "+p.cat).toLowerCase().includes(q));
  const head=isLoc?`<tr><th>Equipamento</th><th>Categoria</th><th class="num">Venda</th><th class="num">Aluguel por mês</th><th class="num">Em estoque</th><th class="num">Em locação</th><th>Leads em aberto</th></tr>`
    :`<tr><th>Produto</th><th>Código</th><th>Categoria</th><th class="num">Preço</th><th class="num">Estoque</th><th>Campanha</th><th>Leads em aberto</th></tr>`;
  const rows=ps.map(p=>{const n=S.leads.filter(l=>l.co===S.co&&l.interest.includes(p.id)&&kindOf(l)==="open").length;const nl=n?`<span class="pill ind">${n} ${n===1?"interessado":"interessados"}</span>`:"";
    return isLoc?`<tr><td><b style="font-weight:600">${esc(p.name)}</b></td><td>${p.cat}</td><td class="num">${money(p.price)}</td><td class="num">${p.rent?money(p.rent):'<span class="muted">só venda</span>'}</td><td class="num ${p.stock<=2?"stock-low":""}">${p.stock}</td><td class="num">${p.rented||"—"}</td><td>${nl}</td></tr>`
    :`<tr><td><b style="font-weight:600">${esc(p.name)}</b></td><td class="muted">${p.code}</td><td>${p.cat}</td><td class="num">${money(p.price)}</td><td class="num ${p.stock<=4?"stock-low":""}">${p.stock}</td><td>${p.promo?`<span class="pill ok">${p.promo}</span>`:""}</td><td>${nl}</td></tr>`}).join("");
  return `<div class="panel"><div class="toolbar" style="justify-content:space-between"><div><h2>${isLoc?"Equipamentos para venda e locação":"Produtos"}</h2><p class="sub" style="margin:2px 0 0">O agente de IA só informa preços e condições cadastrados aqui. Os valores são de exemplo e devem ser trocados pela tabela aprovada.</p></div>
    <input class="inp" id="prodQ" placeholder="Buscar no catálogo" value="${esc(UI.prodQ)}" style="max-width:260px" aria-label="Buscar no catálogo"></div>
    <div class="scroll-x"><table><thead>${head}</thead><tbody>${rows||`<tr><td colspan="7" class="muted">Nada encontrado.</td></tr>`}</tbody></table></div></div>`;
}

  const rs=S.rules.filter(r=>r.co===S.co);
  const pipes=CO().pipelines;const pSel=UI.rulePipe&&pipes[UI.rulePipe]?UI.rulePipe:Object.keys(pipes)[0];
  const fixed=[
    ["Ao mover para Perdido, o motivo é obrigatório","Alimenta o relatório de perdas por motivo."],
    ["Se a equipe envia uma mensagem, a IA pausa naquela conversa","Evita a IA e o vendedor responderem ao mesmo tempo."],
    ["Desconto fora da política, urgência ou pedido de atendente vão para Precisa de mim","A IA nunca inventa condição comercial."],
    ["Fora da janela de 24 horas do WhatsApp, só modelos aprovados","Regra da API oficial da Meta. Vale para a equipe e para a IA."],
    ["Lead aberto sem contato há 7 dias aparece em Reativar leads parados","O envio sempre passa por revisão e mostra o custo estimado."]
  ];
  if(S.co==="loc")fixed.push(["Contrato de locação a 30 dias do fim aparece no Painel","Janela para oferecer a renovação."]);
  return `<div class="grid g-3-1" style="align-items:start"><section class="panel"><h2>Regras por etapa</h2><p class="sub">Quando um lead entra na etapa, o CRM cria a tarefa para o responsável daquele lead.</p>
    <div class="row-list">${rs.map(r=>{const p=pipes[r.pipe];const st=p.stages.find(s=>s.id===r.stage);return `<div class="rule"><div class="grow"><p>Entrou em <em>${st?st.name:r.stage}</em> no funil <em>${p.name}</em>: criar a tarefa <em>“${esc(r.text)}”</em></p><small>${r.days===0?"Prazo para o mesmo dia":"Prazo de "+r.days+(r.days===1?" dia":" dias")}</small></div>
      <label class="switch" title="Ativar ou desativar"><input type="checkbox" data-rule="${r.id}" ${r.on?"checked":""} aria-label="Ativar regra"><span></span></label>
      <button class="btn sm ghost danger" data-action="del-rule" data-id="${r.id}">Excluir</button></div>`}).join("")||'<div class="empty">Nenhuma regra ainda.</div>'}</div>
    <div class="group-h" style="margin-top:20px">Nova regra</div>
    <div class="new-rule"><label class="field"><span>Funil</span><select id="nrPipe">${Object.entries(pipes).map(([k,p])=>`<option value="${k}" ${k===pSel?"selected":""}>${p.name}</option>`).join("")}</select></label>
      <label class="field"><span>Etapa</span><select id="nrStage">${pipes[pSel].stages.filter(s=>s.kind!=="lost").map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}</select></label>
      <label class="field full"><span>Tarefa a criar</span><input id="nrText" placeholder="Ex.: enviar vídeo de uso do equipamento"></label>
      <label class="field"><span>Prazo em dias</span><input id="nrDays" type="number" min="0" value="1"></label>
      <button class="btn primary" data-action="add-rule">Criar regra</button></div></section>
    <section class="panel"><h2>Regras fixas</h2><p class="sub">Valem para as duas empresas e protegem a operação</p><div class="row-list">${fixed.map(([a,b])=>`<div class="rule"><div class="grow"><p>${a}</p><small>${b}</small></div><span class="pill ok">Sempre ativa</span></div>`).join("")}</div></section></div>`;
}
